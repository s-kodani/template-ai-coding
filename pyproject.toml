[project]
name = "template-ai-coding"
version = "0.1.0"
description = "FastMCP ベクトル検索、MCP Apps、Open WebUI、Langfuse トレーシング"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg>=0.30.0",
    "fastmcp>=3.4.11,<4",
    "httpx>=0.28.0",
    "langfuse>=4.15.1,<5",
    "openai>=1.60.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-instrumentation-asyncpg>=0.50b0",
    "opentelemetry-sdk>=1.29.0",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0.0",
    "uvicorn>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pyyaml>=6.0.0",
    "ruff>=0.9.0",
]
e2e = [
    "pytest-playwright>=0.7.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_mcp", "src/web_search_mcp", "src/open_webui_ext", "scripts"]

[tool.hatch.build.targets.wheel.force-include]
"src/knowledge_mcp/static/search-results.html" = "knowledge_mcp/static/search-results.html"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e_smoke: minimal Playwright smoke subset",
    "e2e_brave: requires or validates BRAVE_SEARCH_API_KEY",
    "e2e_reauth: manipulates OAuth token store",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[dependency-groups]
dev = [
    "bandit[toml]>=1.9.4",
    "pre-commit>=4.6.2",
]
