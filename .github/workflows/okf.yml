name: OKF Validation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  okf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/knowledge-search/package-lock.json

      - name: Build MCP App
        working-directory: apps/knowledge-search
        run: npm ci && npm run build

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Validate OKF bundle
        run: uv run python scripts/validate_okf.py

      - name: Run OKF validator tests
        run: uv run pytest tests/test_validate_okf.py
