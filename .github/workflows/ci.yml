name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts gateway

      - name: Pytest
        run: uv run pytest

      - name: Gateway dependencies
        run: uv sync --directory gateway --frozen --extra dev

      - name: Gateway pytest
        run: uv run --directory gateway pytest

      - name: Skill deploy check
        run: uv run python scripts/check_skill_deploy.py --check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Bandit
        run: uv run bandit -r src scripts gateway/src -c pyproject.toml

      - name: uv audit
        run: uv audit --preview-features audit-command

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build app images
        run: docker compose -f infra/app/compose.yml build

      - name: Trivy scan mcp-server image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: knowledge-app-mcp-server
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy scan chainlit image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: knowledge-app-chainlit
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy scan mcp-gateway image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: knowledge-app-mcp-gateway
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
