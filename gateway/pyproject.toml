[project]
name = "mcp-gateway"
version = "0.1.0"
description = "MCP Gateway: Keycloak JWT validation, token exchange, Streamable HTTP client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
    "opentelemetry-api>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
