name: knowledge-app

networks:
  observability:
    external: true
    name: observability
  langfuse_internal:
    external: true
    name: langfuse_default

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      observability:
        aliases:
          - app-postgres

  mcp-server:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.mcp
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@app-postgres:5432/${POSTGRES_DB:-knowledge}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      FASTMCP_STATELESS_HTTP: "true"
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # Streamable HTTP の /mcp は GET を許可しない（405）。TCP で待受を確認する。
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability
      - langfuse_internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/knowledge-realm.json:/opt/keycloak/data/import/knowledge-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - observability

  chainlit:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.chainlit
    env_file:
      - ../../.env
    extra_hosts:
      - "localhost:host-gateway"
    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
      CHAINLIT_URL: http://localhost:8080
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-chainlit-local-auth-secret-change-me}
      OAUTH_KEYCLOAK_CLIENT_ID: ${OAUTH_KEYCLOAK_CLIENT_ID:-chainlit}
      OAUTH_KEYCLOAK_CLIENT_SECRET: ${OAUTH_KEYCLOAK_CLIENT_SECRET:-chainlit-local-secret}
      OAUTH_KEYCLOAK_REALM: ${OAUTH_KEYCLOAK_REALM:-knowledge}
      OAUTH_KEYCLOAK_BASE_URL: http://localhost:8081
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - observability
      - langfuse_internal

volumes:
  postgres_data:
