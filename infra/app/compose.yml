name: knowledge-app

networks:
  observability:
    external: true
    name: observability
  langfuse_internal:
    external: true
    name: langfuse_default

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      observability:
        aliases:
          - app-postgres

  mcp-server:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.mcp
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@app-postgres:5432/${POSTGRES_DB:-knowledge}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      FASTMCP_STATELESS_HTTP: "true"
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
      MCP_JWKS_URI: http://keycloak:8080/realms/knowledge/protocol/openid-connect/certs
      MCP_ISSUER: http://localhost:8081/realms/knowledge
      MCP_AUDIENCE: http://localhost:8000/mcp
      MCP_AUTHORIZATION_SERVER: http://localhost:8081/realms/knowledge
      MCP_RESOURCE_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Streamable HTTP の /mcp は GET を許可しない（405）。TCP で待受を確認する。
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability
      - langfuse_internal

  mcp-gateway:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.gateway
    environment:
      KEYCLOAK_ISSUER: http://localhost:8081/realms/knowledge
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/knowledge/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/knowledge/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: mcp-gateway
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-mcp-gateway-local-secret}
      REGISTRY_PATH: /app/infra/app/gateway-registry.yml
      HOST: 0.0.0.0
      PORT: "8082"
    volumes:
      - ./gateway-registry.yml:/app/infra/app/gateway-registry.yml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8082/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - observability

  keycloak:
    image: keycloak/keycloak:26.4.5
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/knowledge-realm.json:/opt/keycloak/data/import/knowledge-realm.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - observability

  chainlit:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.chainlit
    env_file:
      - ../../.env
    environment:
      MCP_SERVER_URL: http://mcp-server:8000/mcp
      MCP_GATEWAY_URL: http://mcp-gateway:8082
      MCP_GATEWAY_REGISTRY_PATH: /app/infra/app/gateway-registry.yml
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
      DATABASE_URL: ""
      TOKEN_STORE_DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@app-postgres:5432/${POSTGRES_DB:-knowledge}
      TOKEN_STORE_KEY: ${TOKEN_STORE_KEY:-chainlit-token-store-key-change-me}
      CHAINLIT_URL: http://localhost:8080
      CHAINLIT_AUTH_SECRET: ${CHAINLIT_AUTH_SECRET:-chainlit-local-auth-secret-change-me}
      OAUTH_GENERIC_CLIENT_ID: ${OAUTH_GENERIC_CLIENT_ID:-chainlit}
      OAUTH_GENERIC_CLIENT_SECRET: ${OAUTH_GENERIC_CLIENT_SECRET:-chainlit-local-secret}
      OAUTH_GENERIC_AUTH_URL: http://localhost:8081/realms/knowledge/protocol/openid-connect/auth
      OAUTH_GENERIC_TOKEN_URL: http://keycloak:8080/realms/knowledge/protocol/openid-connect/token
      OAUTH_GENERIC_USER_INFO_URL: http://keycloak:8080/realms/knowledge/protocol/openid-connect/userinfo
      OAUTH_GENERIC_SCOPES: openid profile email
      OAUTH_GENERIC_NAME: keycloak
      OAUTH_GENERIC_USER_IDENTIFIER: email
      OAUTH_KEYCLOAK_NAME: unused
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks:
      - observability
      - langfuse_internal

volumes:
  postgres_data:
