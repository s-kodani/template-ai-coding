name: knowledge-app

networks:
  observability:
    external: true
    name: observability
  langfuse_internal:
    external: true
    name: langfuse_default

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-knowledge}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-knowledge} -d ${POSTGRES_DB:-knowledge}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      observability:
        aliases:
          - app-postgres

  mcp-server:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.mcp
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-knowledge}:${POSTGRES_PASSWORD:-change-me}@app-postgres:5432/${POSTGRES_DB:-knowledge}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      FASTMCP_STATELESS_HTTP: "true"
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
      OTEL_SERVICE_NAME: knowledge-mcp
      MCP_JWKS_URI: http://keycloak:8080/realms/knowledge/protocol/openid-connect/certs
      MCP_ISSUER: http://localhost:8081/realms/knowledge
      MCP_AUDIENCE: http://localhost:8000/mcp
      MCP_AUTHORIZATION_SERVER: http://localhost:8081/realms/knowledge
      MCP_RESOURCE_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      # Streamable HTTP の /mcp は GET を許可しない（405）。TCP で待受を確認する。
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8000),3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability
      - langfuse_internal

  web-search-mcp:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.mcp
    command: ["python", "-m", "web_search_mcp.server"]
    env_file:
      - ../../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      MCP_PATH: /mcp
      FASTMCP_STATELESS_HTTP: "true"
      FASTMCP_TELEMETRY_MODE: native
      LANGFUSE_HOST: http://langfuse-web:3000
      OTEL_SERVICE_NAME: web-search-mcp
      MCP_JWKS_URI: http://keycloak:8080/realms/knowledge/protocol/openid-connect/certs
      MCP_ISSUER: http://localhost:8081/realms/knowledge
      MCP_AUDIENCE: http://localhost:8001/mcp
      MCP_AUTHORIZATION_SERVER: http://localhost:8081/realms/knowledge
      MCP_RESOURCE_BASE_URL: http://localhost:8001
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; socket.create_connection(('127.0.0.1',8001),3).close()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability
      - langfuse_internal

  mcp-gateway:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.gateway
    environment:
      KEYCLOAK_ISSUER: http://localhost:8081/realms/knowledge
      KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/knowledge/protocol/openid-connect/certs
      KEYCLOAK_TOKEN_URL: http://keycloak:8080/realms/knowledge/protocol/openid-connect/token
      GATEWAY_CLIENT_ID: mcp-gateway
      GATEWAY_CLIENT_SECRET: ${GATEWAY_CLIENT_SECRET:-mcp-gateway-local-secret}
      GATEWAY_AZP: open-webui
      GATEWAY_AUDIENCE: mcp-gateway
      REGISTRY_PATH: /app/infra/app/gateway-registry.yml
      PUBLIC_BASE_URL: http://mcp-gateway:8082
      HOST: 0.0.0.0
      PORT: "8082"
    volumes:
      - ./gateway-registry.yml:/app/infra/app/gateway-registry.yml:ro
    depends_on:
      keycloak:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
      web-search-mcp:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8082/health', timeout=3)\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - observability

  keycloak:
    image: keycloak/keycloak:26.6.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/knowledge-realm.json:/opt/keycloak/data/import/knowledge-realm.json:ro
      - keycloak_data:/opt/keycloak/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    networks:
      - observability

  keycloak-sync:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.mcp
    command: ["python", "scripts/sync_keycloak_openwebui.py", "--url", "http://keycloak:8080", "--realm", "knowledge", "--realm-file", "infra/app/keycloak/knowledge-realm.json"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}
      OPEN_WEBUI_OAUTH_CLIENT_SECRET: ${OPEN_WEBUI_OAUTH_CLIENT_SECRET:-open-webui-local-secret}
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - observability

  open-webui:
    build:
      context: ../..
      dockerfile: infra/app/Dockerfile.open-webui
    env_file:
      - ../../.env
    environment:
      WEBUI_URL: http://localhost:8080
      DATABASE_URL: sqlite:////app/backend/data/webui.db
      WEBUI_SECRET_KEY: ${OPEN_WEBUI_SECRET_KEY:-open-webui-local-secret-change-me}
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
      ENABLE_LOGIN_FORM: "false"
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      DEFAULT_USER_ROLE: user
      JWT_EXPIRES_IN: 10h
      OAUTH_PROVIDER_NAME: Keycloak
      OAUTH_CLIENT_ID: open-webui
      OAUTH_CLIENT_SECRET: ${OPEN_WEBUI_OAUTH_CLIENT_SECRET:-open-webui-local-secret}
      OAUTH_SCOPES: openid email profile
      OAUTH_CODE_CHALLENGE_METHOD: S256
      OPENID_PROVIDER_URL: http://keycloak:8080/realms/knowledge/.well-known/openid-configuration
      OPENID_REDIRECT_URI: http://localhost:8080/oauth/oidc/callback
      ENABLE_OAUTH_GROUP_MANAGEMENT: "true"
      ENABLE_OAUTH_GROUP_CREATION: "false"
      OAUTH_GROUPS_CLAIM: mcp_roles
      BYPASS_ADMIN_ACCESS_CONTROL: "false"
      ENABLE_OPENAI_API: "true"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_MODEL: ${CHAT_MODEL:-gpt-4o-mini}
      MCP_GATEWAY_REGISTRY_PATH: /app/infra/app/gateway-registry.yml
      ENABLE_OTEL: "false"
      LANGFUSE_HOST: http://langfuse-web:3000
      OTEL_SERVICE_NAME: open-webui
    volumes:
      - open_webui_data:/app/backend/data
      - ./gateway-registry.yml:/app/infra/app/gateway-registry.yml:ro
    ports:
      - "8080:8080"
    depends_on:
      mcp-server:
        condition: service_healthy
      mcp-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      keycloak-sync:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/ready', timeout=3)\"",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - observability
      - langfuse_internal

volumes:
  postgres_data:
  open_webui_data:
  keycloak_data:
